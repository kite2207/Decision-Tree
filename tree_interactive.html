<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Decision Tree — Interactive Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Inter',system-ui,sans-serif;
    background:#f5f2ee;
    color:#2c2825;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ── Topbar ── */
#bar{
    background:#fff;
    border-bottom:1px solid #e5e0d8;
    padding:11px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-shrink:0;
    flex-wrap:wrap;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
}
#bar h1{
    font-size:14px;
    font-weight:600;
    color:#2c2825;
    letter-spacing:-.2px;
    margin-right:4px;
}
#bar h1 span{ color:#8a7560; font-weight:400; }
.sep{ width:1px; height:18px; background:#e5e0d8; flex-shrink:0; }
.lbl{ font-size:12px; color:#9a9088; font-weight:500; }

/* ── Buttons — pill style ── */
.btn{
    padding:5px 14px;
    border:1.5px solid transparent;
    border-radius:99px;
    cursor:pointer;
    font-size:12px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    transition:background .15s, border-color .15s, color .15s;
    letter-spacing:.1px;
}
.bp{ background:#2c2825; color:#f5f2ee; border-color:#2c2825; }
.bp:hover{ background:#1a1714; }
.bt{ background:transparent; color:#2c2825; border-color:#c8c0b4; }
.bt:hover{ background:#ede8e1; }
.bg{ background:transparent; color:#7a7068; border-color:#ddd8d0; }
.bg:hover{ background:#ede8e1; color:#2c2825; }

/* ── Depth slider ── */
.depth-wrap{ display:flex; align-items:center; gap:8px; }
input[type=range]{
    -webkit-appearance:none;
    width:90px;
    height:4px;
    border-radius:2px;
    background:#ddd8d0;
    outline:none;
    cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:#2c2825;
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
}
#dv{
    min-width:18px;
    font-size:12px;
    font-weight:600;
    color:#2c2825;
    font-family:'JetBrains Mono',monospace;
}

/* ── Legend ── */
#leg{ display:flex; gap:14px; margin-left:auto; align-items:center; }
.ld{ display:flex; align-items:center; gap:6px; font-size:11px; color:#7a7068; font-weight:500; }
.lc{ width:10px; height:10px; border-radius:50%; }

/* ── Canvas ── */
#canvas{ flex:1; overflow:hidden; position:relative; }
svg{ width:100%; height:100%; }

/* ── Tree elements ── */
.link{
    fill:none;
    stroke:#c8c0b4;
    stroke-width:1.5px;
    opacity:1;
}
.node circle{
    stroke-width:1.5px;
    cursor:pointer;
    transition:filter .12s;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.12));
}
.node circle:hover{
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.22)) brightness(1.06);
}
.node text{
    font-size:10px;
    font-family:'JetBrains Mono',monospace;
    font-weight:500;
    fill:#5a5048;
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:central;
}
.elbl{
    font-size:9.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    fill:#b0a898;
    pointer-events:none;
    letter-spacing:.3px;
}

/* ── Tooltip ── */
#tip{
    position:absolute;
    background:#fff;
    border:1px solid #e5e0d8;
    border-radius:8px;
    padding:12px 16px;
    font-size:12px;
    pointer-events:none;
    opacity:0;
    transition:opacity .12s;
    max-width:260px;
    z-index:100;
    box-shadow:0 4px 20px rgba(0,0,0,.10);
}
#tip h3{
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
    color:#2c2825;
    border-bottom:1px solid #f0ebe4;
    padding-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
#tip table{ border-collapse:collapse; width:100%; }
#tip td{ padding:2px 4px; line-height:1.6; }
#tip td:first-child{ color:#9a9088; font-size:11px; }
#tip td:last-child{ color:#2c2825; font-weight:600; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11px; }
.tip-pred{ display:inline-block; padding:1px 7px; border-radius:99px; font-size:10px; font-weight:600; }

/* ── Hint ── */
#hint{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.85);
    border:1px solid #e5e0d8;
    border-radius:99px;
    padding:5px 18px;
    font-size:11px;
    color:#b0a898;
    pointer-events:none;
    white-space:nowrap;
    backdrop-filter:blur(4px);
    letter-spacing:.2px;
}
</style>
</head>
<body>
<div id="bar">
  <h1>Decision Tree <span>/ Interactive Viewer</span></h1>
  <div class="sep"></div>
  <div class="depth-wrap">
    <span class="lbl">Depth</span>
    <input type="range" id="ds" min="1" max="26" value="4"/>
    <span id="dv">4</span>
  </div>
  <button class="btn bp" id="bexp">Expand all</button>
  <button class="btn bg"  id="bcol">Collapse</button>
  <button class="btn bt"  id="bres">Fit view</button>
  <div id="leg">
    <div class="ld"><div class="lc" style="background:#c4a882;border:1.5px solid #b8956a"></div>No Purchase</div>
    <div class="ld"><div class="lc" style="background:#82a8c4;border:1.5px solid #6990b0"></div>Purchase</div>
    <div class="ld"><div class="lc" style="background:#ddd8d0;border:1.5px dashed #b0a898"></div>Collapsed</div>
  </div>
</div>
<div id="canvas">
  <svg id="sv"></svg>
  <div id="tip"></div>
  <div id="hint">click to expand &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; drag to pan</div>
</div>

var NR=18, DX=100, DY=90;
/* Neutral pastel palette */
var C_NO  = "#c4a882";  /* warm sand   — No Purchase */
var C_YES = "#82a8c4";  /* soft steel  — Purchase    */
var C_COL = "#4a5568";  /* muted slate — Collapsed   */
var S_NO  = "#b8956a";
var S_YES = "#6990b0";
var S_COL = "#718096";
function nodeColor(d){
    var n=d.data.data;
    if(!n.leaf&&!n.left&&!n.right) return C_COL;
    return n.cls_id===0 ? C_NO : C_YES;
}
function nodeStroke(d){
    var n=d.data.data;
    if(!n.leaf&&!n.left&&!n.right) return S_COL;
    return n.cls_id===0 ? S_NO : S_YES;
}

var svg=d3.select("#sv"), g=svg.append("g");
var zoom=d3.zoom().scaleExtent([.02,3]).on("zoom",function(e){g.attr("transform",e.transform);});
svg.call(zoom);
var layout=d3.tree().nodeSize([DX,DY]);
var linkV=d3.linkVertical().x(function(d){return d.x;}).y(function(d){return d.y;});

var collapsed={};

function deepClone(o){return JSON.parse(JSON.stringify(o));}

function applyCollapse(node){
    if(!node.left&&!node.right)return;
    if(collapsed[node.id]){delete node.left;delete node.right;return;}
    if(node.left)applyCollapse(node.left);
    if(node.right)applyCollapse(node.right);
}

function wrap(n){
    var ch=[];
    if(n.left)ch.push(wrap(n.left));
    if(n.right)ch.push(wrap(n.right));
    return{data:n,children:ch.length?ch:null};
}

var root;

function draw(dur){
    if(dur===undefined)dur=350;
    var data=deepClone(RAW);
    applyCollapse(data);
    root=d3.hierarchy(wrap(data),function(d){return d.children;});
    layout(root);
    var nodes=root.descendants(), links=root.links();

    var lk=g.selectAll(".link").data(links,function(d){return d.target.data.data.id;});
    lk.enter().append("path").attr("class","link")
      .attr("d",function(d){return linkV({source:d.source,target:d.source});})
      .merge(lk).transition().duration(dur).attr("d",linkV);
    lk.exit().remove();

    var el=g.selectAll(".elbl").data(links,function(d){return d.target.data.data.id;});
    el.enter().append("text").attr("class","elbl")
      .merge(el).transition().duration(dur)
      .attr("x",function(d){
          var left=d.source.children&&d.target===d.source.children[0];
          return(d.source.x+d.target.x)/2+(left?-14:14);
      })
      .attr("y",function(d){return(d.source.y+d.target.y)/2;})
      .text(function(d){
          return(d.source.children&&d.target===d.source.children[0])?"T":"F";
      });
    el.exit().remove();

    var nd=g.selectAll(".node").data(nodes,function(d){return d.data.data.id;});
    var ne=nd.enter().append("g").attr("class","node")
        .attr("transform",function(d){return"translate("+d.x+","+d.y+")"; })
        .on("click",function(ev,d){
            ev.stopPropagation();
            toggle(d.data.data);
            draw();
            /* After expand: zoom so the clicked node stays visible and subtree fits */
            setTimeout(function(){ focusNode(d); }, 380);
        })
        .on("mouseover",showTip).on("mousemove",movTip).on("mouseout",hidTip);
    ne.append("circle").attr("r",0);
    ne.append("text");
    var nu=ne.merge(nd);
    nu.transition().duration(dur)
      .attr("transform",function(d){return"translate("+d.x+","+d.y+")"; });
    nu.select("circle").transition().duration(dur)
      .attr("r",function(d){return d.data.data.leaf?NR*.7:NR;})
      .attr("fill",  nodeColor)
      .attr("stroke",nodeStroke);
    nu.select("text").text(function(d){
        var n=d.data.data;
        if(n.leaf)return"L";
        if(!n.left&&!n.right)return"+";
        return"";
    });
    nd.exit().transition().duration(dur).style("opacity",0).remove();
}

function toggle(node){
    if(node.leaf)return;
    if(collapsed[node.id])delete collapsed[node.id];
    else collapsed[node.id]=true;
}

function collapseByDepth(maxD){
    collapsed={};
    function walk(n,d){
        if(!n.left&&!n.right)return;
        if(d>=maxD){collapsed[n.id]=true;return;}
        if(n.left)walk(n.left,d+1);
        if(n.right)walk(n.right,d+1);
    }
    walk(RAW,0);
}

function centerView(){
    if(!root)return;
    var ns=root.descendants();
    var xs=ns.map(function(d){return d.x;}),ys=ns.map(function(d){return d.y;});
    var W=svg.node().clientWidth,H=svg.node().clientHeight;
    var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs);
    var minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
    var tw=maxX-minX+NR*6, th=maxY-minY+NR*6;
    var s=Math.max(Math.min(W/tw, H/th, 2.0)*0.88, 0.05);
    var tx=W/2-s*(minX+maxX)/2, ty=60-s*minY;
    svg.transition().duration(500)
       .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}

/* Zoom to show the subtree rooted at the toggled node */
function focusNode(clickedD){
    if(!root)return;
    /* Collect all currently-visible descendants of the clicked node's position */
    var ns=root.descendants();
    /* Find the node with same id in new layout */
    var target=null;
    ns.forEach(function(n){ if(n.data.data.id===clickedD.data.data.id) target=n; });
    if(!target){centerView();return;}
    /* Gather target + its visible children */
    var sub=[];
    function gather(n){ sub.push(n); if(n.children) n.children.forEach(gather); }
    gather(target);
    if(sub.length<=1){centerView();return;}
    var xs=sub.map(function(d){return d.x;}), ys=sub.map(function(d){return d.y;});
    var W=svg.node().clientWidth, H=svg.node().clientHeight;
    var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
    var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
    var tw=maxX-minX+NR*10, th=maxY-minY+NR*10;
    var s=Math.max(Math.min(W/tw, H/th, 2.5)*0.82, 0.1);
    var tx=W/2-s*(minX+maxX)/2, ty=H*0.15-s*minY;
    svg.transition().duration(500)
       .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}

var ds=document.getElementById("ds"),dv=document.getElementById("dv");
ds.addEventListener("input",function(){
    dv.textContent=ds.value;collapseByDepth(+ds.value);draw();setTimeout(centerView,380);
});
document.getElementById("bexp").addEventListener("click",function(){
    collapsed={};draw();setTimeout(centerView,380);
});
document.getElementById("bcol").addEventListener("click",function(){
    ds.value=1;dv.textContent="1";collapseByDepth(1);draw();setTimeout(centerView,380);
});
document.getElementById("bres").addEventListener("click",centerView);

var tip=document.getElementById("tip");
function showTip(ev,d){
    var n=d.data.data,t=n.values[0]+n.values[1];
    var p0=t?(n.values[0]/t*100).toFixed(1):0,p1=t?(n.values[1]/t*100).toFixed(1):0;
    var predColor=n.cls_id===0?"#b8956a":"#6990b0";
    var predBg  =n.cls_id===0?"#f5ede3":"#e8f0f7";
    var h="<h3>"+(n.leaf?"Leaf node":"Split")+": "+n.name+"</h3><table>";
    h+="<tr><td>Node</td><td>#"+n.id+" &middot; depth "+n.depth+"</td></tr>";
    h+="<tr><td>Samples</td><td>"+n.samples.toLocaleString()+"</td></tr>";
    h+="<tr><td>No Purchase</td><td>"+n.values[0].toLocaleString()+" <span style='color:#9a9088'>("+p0+"%)</span></td></tr>";
    h+="<tr><td>Purchase</td><td>"+n.values[1].toLocaleString()+" <span style='color:#9a9088'>("+p1+"%)</span></td></tr>";
    h+="<tr><td>Gini</td><td>"+n.gini+"</td></tr>";
    h+="<tr><td>Predict</td><td><span style='background:"+predBg+";color:"+predColor+";padding:1px 8px;border-radius:99px;font-size:10px;font-weight:600'>"+n.cls+"</span></td></tr>";
    if(!n.leaf&&n.feature){
        h+="<tr><td style='padding-top:6px;color:#c8c0b4' colspan='2'></td></tr>";
        h+="<tr><td>Feature</td><td style='font-size:10px;word-break:break-all'>"+n.short+"</td></tr>";
        h+="<tr><td>Threshold</td><td>&le; "+n.threshold+"</td></tr>";
    }
    h+="</table>";
    tip.innerHTML=h;tip.style.opacity=1;movTip(ev);
}
function movTip(ev){
    var r=document.getElementById("canvas").getBoundingClientRect();
    var x=ev.clientX-r.left+14,y=ev.clientY-r.top-10;
    if(x+280>r.width)x-=300;if(y+220>r.height)y-=220;
    tip.style.left=x+"px";tip.style.top=y+"px";
}
function hidTip(){tip.style.opacity=0;}

collapseByDepth(4);
draw(0);
setTimeout(centerView,120);
</script>
</body>
